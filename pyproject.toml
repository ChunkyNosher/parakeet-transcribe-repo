[project]
name = "parakeet-transcribe"
version = "1.0.0"
description = "Private, local NVIDIA ASR transcription for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio==6.20.0",
    "librosa==0.11.0",
    "numba==0.66.0",
    "numpy==2.4.6",
    "soundfile==0.14.0",
    "torch==2.13.0+cu130",
    "transformers==5.13.1",
    "yt-dlp==2026.6.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.2",
]

[project.scripts]
parakeet-transcribe = "parakeet_transcribe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.hatch.build.targets.wheel]
packages = ["src/parakeet_transcribe"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
