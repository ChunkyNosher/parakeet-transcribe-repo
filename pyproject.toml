[project]
name = "parakeet-transcribe"
version = "1.0.0"
description = "Local NVIDIA NeMo ASR transcription via Docker (Linux GPU)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Gradio 6 needs huggingface-hub>=1.x; NeMo's transformers pin needs hub<1.0.
    "gradio==5.49.1",
    "librosa==0.11.0",
    "numba>=0.60,<0.62",
    "numpy>=1.26.4,<2.0",
    "omegaconf==2.3.0",
    "soundfile==0.14.0",
    "yt-dlp==2026.6.9",
    # NeMo ASR is Linux-only (Docker Compose). Windows hosts run unit tests without it.
    "nemo_toolkit[asr,cu13]==2.7.3; sys_platform == 'linux'",
    "torch==2.13.0; sys_platform == 'linux'",
    # Enables NeMo CUDA-graph while-loop decoding (conditional nodes).
    "cuda-python>=13.0; sys_platform == 'linux'",
    # Punctuation/capitalization restoration for the lowercase-vocab Parakeet 1.1B
    # checkpoint (NeMo's own PunctuationCapitalizationModel was removed in NeMo >=2.5).
    # CPU ONNX runtime keeps this off the GPU. Linux-only (container) like NeMo.
    "punctuators==0.0.7; sys_platform == 'linux'",
    "onnxruntime>=1.17; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.2",
]

[project.scripts]
parakeet-transcribe = "parakeet_transcribe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parakeet_transcribe"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp-nemo"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
