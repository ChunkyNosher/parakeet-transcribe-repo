services:
  parakeet-transcribe:
    build:
      context: .
      dockerfile: Dockerfile
      # Persist BuildKit layer + mount caches across rebuilds (NeMo/uv are expensive).
      # Requires Docker BuildKit (default on Docker Desktop). First build creates the dir.
      cache_from:
        - type=local,src=./docker-data/build-cache
      cache_to:
        - type=local,dest=./docker-data/build-cache,mode=max
    image: parakeet-transcribe:local
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      HF_HOME: /data/model_cache/huggingface
      HF_HUB_CACHE: /data/model_cache/huggingface/hub
      PARAKEET_OUTPUT_DIR: /data/outputs
      PARAKEET_SERVER_NAME: 0.0.0.0
      PARAKEET_SERVER_PORT: "7860"
      # Models load lazily on the first transcription request and are evicted
      # from VRAM after this many seconds of inactivity (0 disables the eviction).
      PARAKEET_IDLE_UNLOAD_SECONDS: "180"
      # Optional: load this model key into VRAM in the background at startup
      # (e.g. "parakeet-v3"). Off by default; unset keeps lazy loading.
      PARAKEET_PRELOAD_MODEL: ""
      # Persist Triton's JIT-compiled CUDA helpers across restarts/rebuilds so
      # repeated cold starts do not recompile them.
      TRITON_CACHE_DIR: /data/model_cache/triton
      # NeMo's official RNNT/TDT buffered-inference script enables expandable
      # CUDA segments to prevent allocator fragmentation across streaming windows.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # Legacy checkpoints (parakeet-tdt-1.1b) predate PyTorch 2.6's weights_only
      # default; NVIDIA documents this override to load them. All model downloads
      # come from NVIDIA's official Hugging Face repos.
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
    volumes:
      # Editable install + bind mount: host ./src changes apply without image rebuild.
      # Restart the process to reload Python imports (Compose Watch does this automatically).
      - ./src:/app/src
      - ./docker-data/model_cache:/data/model_cache
      - ./docker-data/outputs:/data/outputs
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync+restart
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
